name: Unit test
on:
  pull_request:
    branches:
      - dev
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      VERSION_NO: ${{ steps.get_version.outputs.VERSION_NO }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - name: Get version number
        id: get_version
        run: |
          version_no=$(cat app/main.cpp | grep "app.setApplicationVersion" | grep -oE "[0-9]+.[0-9]+.[0-9]+")
          echo "VERSION_NO=${version_no}" >> "$GITHUB_OUTPUT"
      - name: Check OAuth client metadata
        run: |
          curl -fsSL --retry 3 https://oauth.hagoromo.relog.tech/oauth-client-metadata.json -o remote-oauth-client-metadata.json
          if diff -u <(jq -S . lib/account/oauth/oauth-client-metadata.json) <(jq -S . remote-oauth-client-metadata.json); then
            echo ok
          else
            echo "lib/account/oauth/oauth-client-metadata.json does not match https://oauth.hagoromo.relog.tech/oauth-client-metadata.json"
            exit 1
          fi

  linux:
    needs: prepare
    uses: ./.github/workflows/build_linux.yml
    secrets: inherit
    with:
      upload: true
      VERSION_NO: ${{ needs.prepare.outputs.VERSION_NO }}
      unit_test: true

  windows:
    needs: prepare
    uses: ./.github/workflows/build_win.yml
    secrets: inherit
    with:
      upload: true
      VERSION_NO: ${{ needs.prepare.outputs.VERSION_NO }}
      unit_test: true

  mac:
    needs: prepare
    uses: ./.github/workflows/build_mac.yml
    secrets: inherit
    with:
      upload: true
      VERSION_NO: ${{ needs.prepare.outputs.VERSION_NO }}
      unit_test: true

  check-sources:
    uses: ./.github/workflows/check_sources.yml

  result:
    runs-on: ubuntu-22.04
    needs: [linux, windows, mac, check-sources]
    if: always() # 前提ジョブがスキップされても必ず実行する
    steps:
      - name: Check results
        run: |
          # run-tests が「成功」じゃなければNGにする
          if [[ "${{ needs.linux.result }}" != "success" ]]; then
            echo "Linux tests failed or cancelled"
            exit 1
          fi
          if [[ "${{ needs.windows.result }}" != "success" ]]; then
            echo "Windows tests failed or cancelled"
            exit 1
          fi
          if [[ "${{ needs.mac.result }}" != "success" ]]; then
            echo "Mac tests failed or cancelled"
            exit 1
          fi
          if [[ "${{ needs.check-sources.result }}" != "success" ]]; then
            echo "Check sources failed or cancelled"
            exit 1
          fi
          echo "All tests passed or skipped"
          exit 0
